[workspace]
resolver = "3"
members = [
    "crates/oxide-core",
    "crates/oxide-alloc",
    "crates/oxide-hardware/oxide-backend-cuda",
    "crates/oxide-hardware/oxide-backend-rocm",
    "crates/oxide-hardware/oxide-backend-metal",
    "crates/oxide-hardware/oxide-backend-cpu",
    "crates/oxide-models",
    "crates/oxide-quant",
    "crates/oxide-server",
    "crates/oxide-engine",
    "crates/oxide-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Faez Barghasa <faez.barghasa@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FaezBarghasa/Oxide-Tech-LLM-Engine"

[workspace.dependencies]
oxide-core = { path = "crates/oxide-core" }
oxide-alloc = { path = "crates/oxide-alloc" }
oxide-backend-cuda = { path = "crates/oxide-hardware/oxide-backend-cuda" }
oxide-backend-rocm = { path = "crates/oxide-hardware/oxide-backend-rocm" }
oxide-backend-metal = { path = "crates/oxide-hardware/oxide-backend-metal" }
oxide-backend-cpu = { path = "crates/oxide-hardware/oxide-backend-cpu" }
oxide-models = { path = "crates/oxide-models" }
oxide-quant = { path = "crates/oxide-quant" }
oxide-server = { path = "crates/oxide-server" }
oxide-engine = { path = "crates/oxide-engine" }

crossbeam = "0.8"
crossbeam-epoch = "0.9"
crossbeam-utils = "0.8"
crossbeam-queue = "0.3"
rtrb = "0.4.0"
memmap2 = "0.9"
bytemuck = { version = "1.21", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["tokio", "http2"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-stream = "0.3"
futures-util = "0.3"
core_affinity = "0.8"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = true

[profile.release-specialized]
inherits = "release"
incremental = false
rpath = false
